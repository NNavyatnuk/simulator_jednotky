name: Tests
on: [push, pull_request]
jobs:
  desktop:
    strategy:
      matrix:
        os: [ubuntu-24.04, windows-2022]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.3'
          arch: ${{ runner.os == 'Windows' && 'win64_msvc2022_64' || 'linux_gcc_64' }}
          modules: 'qtserialport'
          cache: true
      - name: Configure Windows desktop (VS 2022)
        if: runner.os == 'Windows'
        env:
          QTDIR: ${{ env.QT_ROOT_DIR }}
        run: cmake --preset windows-vs2022
      - name: Build Windows desktop and tests
        if: runner.os == 'Windows'
        run: cmake --build --preset windows-release
      - name: Test Windows desktop
        if: runner.os == 'Windows'
        run: ctest --preset windows-release
      - name: Package Windows desktop with Qt runtime
        if: runner.os == 'Windows'
        # Qt requires an absolute prefix when generating the installed qt.conf.
        run: cmake --install build/windows-vs2022 --config Release --prefix "${{ github.workspace }}/build/windows-package"
      - name: Smoke test packaged Windows app without development Qt
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          # Test the shipped DLLs/plugins, not the Qt installation on the runner.
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:QT_PLUGIN_PATH -ErrorAction SilentlyContinue
          Remove-Item Env:QT_QPA_PLATFORM_PLUGIN_PATH -ErrorAction SilentlyContinue
          $env:QT_QPA_PLATFORM = 'windows'
          $env:QT_FORCE_STDERR_LOGGING = '1'
          $stderr = Join-Path $env:RUNNER_TEMP 'simulator-startup-stderr.txt'
          $stdout = Join-Path $env:RUNNER_TEMP 'simulator-startup-stdout.txt'
          # This is a GUI-subsystem executable: explicitly wait for its process
          # and use that process's exit code rather than shell LASTEXITCODE.
          $app = Start-Process -FilePath './build/windows-package/bin/simulator_jednotky.exe' -ArgumentList '--smoke-test' -PassThru -Wait -RedirectStandardError $stderr -RedirectStandardOutput $stdout
          Get-Content $stdout, $stderr
          if ($app.ExitCode -ne 0) {
            $details = ((Get-Content $stderr -Tail 15) -join ' ') -replace '[\r\n]', ' '
            Write-Output "::error title=Packaged application startup::Exit code $($app.ExitCode). $details"
            Get-ChildItem './build/windows-package' -Recurse -File | Select-Object FullName
            exit 1
          }
      - name: Configure Linux desktop
        if: runner.os == 'Linux'
        run: cmake -S . -B build/desktop -DCMAKE_BUILD_TYPE=Release
      - name: Build Linux desktop and tests
        if: runner.os == 'Linux'
        run: cmake --build build/desktop --target simulator_jednotky desktop_tests --parallel 2
      - name: Test Linux desktop, including actual serial pseudoterminal
        if: runner.os == 'Linux'
        run: ctest --test-dir build/desktop --output-on-failure --no-tests=error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: Formula-Lab-Windows-x64
          path: build/windows-package/
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .node-version
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx playwright-core install --with-deps chromium
      - run: npm run test:e2e
      - name: Browser workflow through native C++ entry point
        shell: bash
        run: |
          c++ -std=c++17 -O2 src/main.cpp -o /tmp/simulator-native
          /tmp/simulator-native --root "$PWD" --port 3001 > /tmp/simulator-native.log 2>&1 &
          simulator_native_pid=$!
          trap 'kill "$simulator_native_pid"' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3001/health > /dev/null; then break; fi
            sleep 0.1
          done
          SIMULATOR_E2E_URL=http://127.0.0.1:3001 npm run test:e2e
